name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evil-rises-release
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish stable WoW Forever release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    env:
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, validate, and stage the release ZIP
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m scripts.release package

      - name: Publish to CurseForge and save the receipt
        if: steps.package.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: python3 -B -m scripts.release publish-curseforge

      - name: Verify the receipt and publish to GitHub
        if: steps.package.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: python3 -B -m scripts.release publish-github

      - name: Retain release files for recovery
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-files-${{ github.run_attempt }}
          path: |
            .release/*.zip
            .release/release.json
            .release/curseforge-*.json
          include-hidden-files: true
          if-no-files-found: ignore

  sync-toc:
    name: Open TOC version bump PR
    needs: deploy
    if: needs.deploy.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Write the published version to the TOC
        id: toc
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$RELEASE_TAG" != "$latest" ]]; then
            echo "Skipping TOC sync for $RELEASE_TAG because $latest is now the latest release."
            exit 0
          fi
          python3 -B -m scripts.release --sync-toc "$RELEASE_TAG"
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Open or update the version bump PR
        if: steps.toc.outputs.current == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/sync-toc
          base: main
          add-paths: EVILRises/EVILRises.toc
          title: "chore(release): sync TOC to ${{ needs.deploy.outputs.tag }}"
          commit-message: "chore(release): sync TOC to ${{ needs.deploy.outputs.tag }}"
          body: Update the source TOC to match the published EVIL Rises release.
