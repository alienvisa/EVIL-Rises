name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Show release bump from PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -B -m scripts.release --title="$PR_TITLE"

      - name: Check Lua syntax and run Lua tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find EVILRises -name '*.lua' -exec luac5.1 -p {} +
          lua5.1 tests/GuildSync.lua

      - name: Test release versioning and publication recovery
        run: python3 -B -m unittest discover -s tests

      - name: Test real BigWigs packaging
        run: python3 -B -m unittest discover -s tests -p package.py
